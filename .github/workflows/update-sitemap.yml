name: update-sitemap

# サイトの更新時に sitemap.xml の <lastmod> を自動で合わせる。
# 手で直し忘れても、各ファイルの最終コミット日が必ず反映される。

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'pdf/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 各ファイルの最終コミット日を引くため全履歴が必要

      - name: Update lastmod
        run: python tools/update-sitemap.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "sitemap.xml の lastmod を自動更新"
          git push
